# 测试服 nginx（腾讯 /opt/flashmuse-staging/data/nginx/flashmuse-staging.conf）
# ⭐⭐ 2026-07-30 新增「大响应不落盘 + JSON 压缩」，与正式服 nginx/flashmuse.conf 保持一致。
#     原因见 handover/06-memo-tasks.md 的 M024：/api/workspace-state?summary=1&panel=chat
#     响应最大 1.19MB，撑爆 nginx 默认 32KB 缓冲 → 落盘临时文件 → 打开工作台转圈 17~30 秒。
# ⭐ 2026-08-02：API 限流，与正式服 nginx/flashmuse.conf 同批（zone 名带项目前缀）。
# ⛔⛔ 2026-08-02 审计复核修正（与正式服那份改法完全一致，两服关键配置必须一样）：
#   ① 测试服的**唯一入口也是阿里**（8080 / staging-static）→ 到这里 `$remote_addr` 只有阿里一个 IP，
#      不还原就会把全部用户算成一个客户端一起 429。只信阿里那一跳写的 X-Real-IP。
#   ② `location /` 也代理 `_next/static`，冷启动一个页面瞬间几十个请求 → burst 放到 200，rate 50r/s。
set_real_ip_from 101.37.129.164;
real_ip_header X-Real-IP;

limit_req_zone $binary_remote_addr zone=fm_staging_api:10m rate=50r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 1024m;
    client_body_timeout 300s;

    # ⭐ 大响应不落盘
    proxy_buffer_size 32k;
    proxy_buffers 32 32k;
    proxy_busy_buffers_size 128k;
    proxy_max_temp_file_size 0;

    # ⭐ JSON 压缩（刻意不压 /generated：图片视频本来就压过了）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain text/javascript application/x-javascript image/svg+xml;

    # ⛔⛔ 内部台账绝不对外（2026-08-04 加，与正式服 nginx/flashmuse.conf 完全一致）：
    #     videos/manifest.json 有全站用户提示词 + 供应商预签名地址；代码已迁到 .runtime/。
    location = /generated/videos/manifest.json { return 404; }

    location /generated/ {
        alias /srv/generated/;
        access_log off;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        # ⛔ 安全（2026-08-02 加，与正式服 nginx/flashmuse.conf 完全一致）：禁止 MIME 嗅探。
        add_header X-Content-Type-Options "nosniff" always;

        # ⛔⛔ 危险后缀一律当附件下载，绝不在本域内渲染/执行（防同源存储型 XSS）。
        #    ⚠️ nginx 特性：`if` 是新的配置层级，里面写了 add_header 就**不再继承外层的**，
        #       所以必须把上面几个头重新写一遍。
        if ($uri ~* "\.(?:html?|xhtml|xht|shtml|svgz?|xml|xsl|js|mjs|css|wasm)$") {
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        try_files $uri =404;
    }

    location /home-assets/ {
        alias /srv/home-assets/;
        access_log off;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://staging-app:3000;
        limit_req zone=fm_staging_api burst=200 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "gzip";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
