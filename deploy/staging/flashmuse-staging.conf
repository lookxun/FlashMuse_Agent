# 测试服 nginx（腾讯 /opt/flashmuse-staging/data/nginx/flashmuse-staging.conf）
# ⭐⭐ 2026-07-30 新增「大响应不落盘 + JSON 压缩」，与正式服 nginx/flashmuse.conf 保持一致。
#     原因见 handover/06-memo-tasks.md 的 M024：/api/workspace-state?summary=1&panel=chat
#     响应最大 1.19MB，撑爆 nginx 默认 32KB 缓冲 → 落盘临时文件 → 打开工作台转圈 17~30 秒。
server {
    listen 80;
    server_name _;

    client_max_body_size 1024m;
    client_body_timeout 300s;

    # ⭐ 大响应不落盘
    proxy_buffer_size 32k;
    proxy_buffers 32 32k;
    proxy_busy_buffers_size 128k;
    proxy_max_temp_file_size 0;

    # ⭐ JSON 压缩（刻意不压 /generated：图片视频本来就压过了）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain text/javascript application/x-javascript image/svg+xml;

    location /generated/ {
        alias /srv/generated/;
        access_log off;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location /home-assets/ {
        alias /srv/home-assets/;
        access_log off;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://staging-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "gzip";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
