# 阿里测试服入口（部署到 /etc/nginx/sites-enabled/flashmuse-test-8080），反代回腾讯 staging :5001。
# ⭐⭐ 2026-07-30 新增「大响应不落盘 + JSON 压缩」（原因见 handover/06-memo-tasks.md 的 M024）。
#     ⚠️ 这台的 nginx.conf 里 `gzip on` 是开的，但 **gzip_types 整段是注释掉的** →
#        默认只压 text/html，**API 的 JSON 根本没被压过**。所以这里必须显式写 gzip_types。
#
# ⭐⭐⭐ 2026-08-01 新增「回源长连接复用（upstream keepalive）」—— 治「走阿里比直连腾讯慢 10 倍」。
#   根因（实测）：阿里 → 腾讯新加坡这一跳 **RTT 255ms、丢包 25~37%**，
#   而原配置 ① 没有 upstream 块、没有 keepalive ② 还写死了 `Connection "upgrade"`
#   → **每一个请求都要在这条烂路上重新握一次 TCP 手，永远不复用**。
#   而 SYN 阶段没有快速重传，只能靠 RTO 指数退避（实测 0.25s / 1.27s / 3.2s / 11.4s）
#   → 每次握手约 1/3 概率被罚站几秒，这就是「忽快忽慢、偶尔卡死几十秒」的来源。
#   改法 = 建 upstream + keepalive，普通请求 Connection 置空（HTTP/1.1 默认长连接），
#   只有真正的 WebSocket 升级请求才发 `Connection: upgrade`（靠下面那个 map 区分）。
#
# ⛔ 命名必须带 fm_test_ 前缀：这台 nginx 还 include 着别的项目的 conf，
#    upstream 名 / map 变量名重名会导致 `duplicate` 直接起不来。

# 回源腾讯 staging 的长连接池（keepalive 32 = 每个 worker 最多保持 32 条常驻跨境连接）
upstream fm_test_app {
    server 119.28.116.16:5001;
    keepalive 32;
    keepalive_timeout 300s;
    keepalive_requests 1000;
}

# 普通请求 → Connection 置空（走 HTTP/1.1 长连接）；WebSocket 请求 → Connection: upgrade
map $http_upgrade $fm_test_conn_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    client_max_body_size 1024m;
    client_body_timeout 300s;
    access_log /var/log/nginx/flashmuse-test-access.log;
    error_log /var/log/nginx/flashmuse-test-error.log;

    # ⭐ 大响应不落盘（默认 8×4k=32KB 撑不住 1MB 级响应，会写磁盘临时文件）
    proxy_buffer_size 32k;
    proxy_buffers 32 32k;
    proxy_busy_buffers_size 128k;
    proxy_max_temp_file_size 0;

    # ⭐ JSON 压缩（本机 nginx.conf 的 gzip_types 是注释状态，必须在这里显式声明）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location /home-assets/ {
        alias /var/www/flashmuse-static-test/home-assets/;
        try_files $uri =404;
        gzip off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /_next/static/ {
        alias /var/www/flashmuse-static-test/_next/static/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    location /generated/ {
        root /var/www/flashmuse-static-test;
        try_files $uri @gen_test;
        gzip off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin * always;
        # ⛔ 安全（2026-08-02 加，与正式服 nginx/flashmuse.conf 完全一致）：禁止 MIME 嗅探。
        add_header X-Content-Type-Options "nosniff" always;

        # ⛔⛔ 危险后缀一律当附件下载，绝不在本域内渲染/执行（防同源存储型 XSS）。
        #    ⚠️ nginx 特性：`if` 是新的配置层级，里面写了 add_header 就**不再继承外层的**，
        #       所以必须把上面几个头重新写一遍。
        if ($uri ~* "\.(?:html?|xhtml|xht|shtml|svgz?|xml|xsl|js|mjs|css|wasm)$") {
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            add_header Access-Control-Allow-Origin * always;
        }
    }

    location @gen_test {
        proxy_pass http://fm_test_app;
        # ⭐ 长连接复用必需：默认是 HTTP/1.0 + Connection: close，那样 keepalive 池等于没用
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        proxy_pass http://fm_test_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        # ⛔ 原来这里写死 `Connection "upgrade"` → 每个请求都被当成升级请求、连接不复用。
        #    改成 map 出来的变量：普通请求为空（长连接），WebSocket 才是 upgrade。
        proxy_set_header Connection $fm_test_conn_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
