# 阿里测试服 HTTPS 入口（staging-static.venusface.com），反代回腾讯 staging :5001。
#
# ⚠️⚠️ 依赖 `flashmuse-test-8080.conf` 顶部定义的 `upstream fm_test_app` 与 `map $fm_test_conn_upgrade`
#      （upstream/map 在 http 上下文全局可见，与文件加载顺序无关）。
#      ⛔ **这两份必须一起部署**，只部署本份会因找不到 upstream 直接起不来。
#
# ⭐⭐⭐ 2026-08-01：本份原来漏了两批优化（M024 当时只加到了 8080 那份），现一并补齐：
#   ① 大响应不落盘（proxy_buffer*）② JSON gzip ③ 回源长连接复用（upstream keepalive）
#   ③ 的根因：阿里→腾讯这一跳 RTT 255ms、丢包 25~37%，而原来写死 `Connection "upgrade"`
#   → 每个请求都在烂路上重新握手，SYN 丢包只能 RTO 指数退避（0.25/1.27/3.2/11.4s）= 偶发卡死几十秒。
server {
    listen 80;
    listen [::]:80;
    server_name staging-static.venusface.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging-static.venusface.com;

    ssl_certificate /etc/letsencrypt/live/staging-static.venusface.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-static.venusface.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_ecdh_curve prime256v1:secp384r1;

    client_max_body_size 1024m;
    client_body_timeout 300s;
    access_log /var/log/nginx/flashmuse-test-access.log;
    error_log /var/log/nginx/flashmuse-test-error.log;

    # ⭐ 大响应不落盘（默认 8×4k=32KB 撑不住 1MB 级响应，会写磁盘临时文件再转发）
    proxy_buffer_size 32k;
    proxy_buffers 32 32k;
    proxy_busy_buffers_size 128k;
    proxy_max_temp_file_size 0;

    # ⭐ JSON 压缩（本机 nginx.conf 的 gzip_types 是注释状态，必须在这里显式声明）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location /home-assets/ {
        alias /var/www/flashmuse-static-test/home-assets/;
        try_files $uri =404;
        gzip off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    location /_next/static/ {
        alias /var/www/flashmuse-static-test/_next/static/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    location /generated/ {
        root /var/www/flashmuse-static-test;
        try_files $uri @gen_test_ssl;
        gzip off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    location @gen_test_ssl {
        proxy_pass http://fm_test_app;
        # ⭐ 长连接复用必需：默认 HTTP/1.0 + Connection: close，那样 keepalive 池等于没用
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        proxy_pass http://fm_test_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        # ⛔ 原来写死 `Connection "upgrade"` → 每个请求都被当成升级请求、连接不复用
        proxy_set_header Connection $fm_test_conn_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
