# FlashMuse nginx (Tencent Singapore Docker stack).
# Deployed to: /opt/flashmuse/data/nginx/flashmuse.conf  (bind-mounted into flashmuse-nginx as /etc/nginx/conf.d/default.conf)
#
# WHY this exists: Next.js `next start` only serves public/ files that existed at BUILD time.
# public/generated is excluded by .dockerignore, so Next returns 404 for /generated/*.
# On Malaysia/Ali, /generated was always served by that host's own nginx (never Next).
# On the Tencent pure-Docker stack there is no host nginx, so this container serves /generated + /home-assets
# from disk and reverse-proxies everything else to the app. Mirrors the Malaysia architecture.
#
# ⚠️⚠️ 2026-07-30：本文件之前**和服务器上那份不一致**（服务器上多了 443 server 块和
#     /generated 的 CORS 头，仓库这份还是旧的单 server 版）。已按服务器实际内容同步回来。
#     ⭐ 以后改 nginx **先改这份、再部署过去**，别只在服务器上手改，否则又会漂移。
#
# ⭐⭐ 2026-07-30 新增「大响应不落盘 + JSON 压缩」（性能优化，实测根因见 handover/06 的 M024）：
#     nginx 默认 proxy_buffers 只有 8×4k=32KB，而 /api/workspace-state?summary=1&panel=chat
#     的响应线上实测最大 **1.19MB** → nginx 只能把整个响应**先写磁盘临时文件**再转发
#     （error.log 里明确写着 `an upstream response is buffered to a temporary file`），
#     叠加跨境传输就是「打开工作台转圈 17~30 秒」。
#     下面两组指令：① 把缓冲区放大到能直接装下 1MB 级响应（不再落盘）；
#                   ② 对 JSON 开 gzip（这类响应通常能压到 15%~30%）。
#     ⛔ 注意 gzip 只对**下行**生效，且刻意**不压 /generated**（图片视频本来就是压缩格式，白耗 CPU）。
#
# ⭐ 2026-08-02 安全加固（审计 2.8m/n/o）：
#     ① API 限流（全项目第一份 limit_req）：防匿名并发刷接口。
#     ② 80 端口对 main/api 域名 301 跳 443（原来是明文代理真站，会话 cookie 走明文）。
#        ⛔ 只对这两个 Host 跳：IP:5000 的健康检查/部署巡检和其它 Host 不受影响。
#        ⭐ 已核实阿里回源发的是 `Host: 101.47.19.109`（不是 main/api）→ 国内入口不受这条跳转影响。
#     ③ 443 加安全响应头 + ssl_session_cache（255ms RTT 下免每次全握手）。
#
# ⛔⛔ 2026-08-02 审计复核修正（限流的两个真坑，改限流前必读）：
#   坑① **国内用户全部经阿里 101.37.129.164 回源，到这里 `$remote_addr` 只有阿里那一个 IP**
#        → 不做 real_ip 还原时，`limit_req_zone $binary_remote_addr` 会把**全部国内用户算成一个客户端**，
#          几个人同时用就一起 429。所以必须 `set_real_ip_from` 只信阿里那一跳 + 取它写的 X-Real-IP。
#        ⭐ 只信阿里这一个来源：直连 main/api 的客户端自己伪造 X-Real-IP 一律无效。
#   坑② **`location /` 也代理 `_next/static`**（Next 的 chunk 走这里，不像阿里侧有本地镜像）
#        → 冷启动一个页面可能瞬间几十个请求，burst=60 会把真实用户打成 429（白屏）。
#          限流目的是拦"每秒成百上千"的滥用，不是给正常用户找麻烦 → 放宽到 50r/s + burst 200。
set_real_ip_from 101.37.129.164;
real_ip_header X-Real-IP;

limit_req_zone $binary_remote_addr zone=fm_api:10m rate=50r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # 见文件头 ②：只对 main/api 域名跳 443，IP:5000 直访保持明文可用
    if ($host ~* "^(main|api)\.venusface\.com$") {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 1024m;
    client_body_timeout 300s;

    # ⭐ 大响应不落盘（见文件头注释）
    proxy_buffer_size 32k;
    proxy_buffers 32 32k;
    proxy_busy_buffers_size 128k;
    proxy_max_temp_file_size 0;

    # ⭐ JSON 压缩（API 响应是纯文本，压缩收益极大）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain text/javascript application/x-javascript image/svg+xml;

    # ⛔⛔ 内部台账绝不对外（2026-08-04 加）：videos/manifest.json 是服务端的视频恢复台账，
    #     里面有全站用户的完整提示词、用户 ID 和供应商预签名下载地址（24 小时内可直接下片）。
    #     代码已把它迁到 .runtime/video-manifest.json；这里堵住"历史已存在的那一份"
    #     （腾讯本地会被代码自动删掉，但**阿里镜像里那份删不掉**，必须靠 nginx 兜底）。
    #     ⭐ `location =` 是精确匹配，优先级高于下面的 `location /generated/`。
    location = /generated/videos/manifest.json { return 404; }

    # 生成媒体：由 nginx 直接服务磁盘文件（对齐马来架构，Next 不服务 /generated）
    location /generated/ {
        alias /srv/generated/;
        access_log off;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        # ⛔ 安全（2026-08-02 加）：禁止浏览器按内容猜 MIME。
        add_header X-Content-Type-Options "nosniff" always;

        # ⛔⛔ 危险后缀一律当附件下载，绝不在本域内渲染/执行（防同源存储型 XSS）。
        #    背景：`/api/upload-file` 的文档路径历史上零校验、落盘后缀直接取客户端文件名，
        #    所以线上可能存在 `.html` / `.svg`。它们和主站**同源**，一旦被浏览器渲染就能
        #    以受害者身份调用全部接口（cookie 是 httpOnly，偷不走，但能驱动）。
        #    上传侧的后缀白名单已经堵住"新增"，这里堵住"历史已存在的"。
        #    ⚠️ nginx 特性：`if` 是一个新的配置层级，一旦在里面写了 add_header，
        #       **外层的 add_header 全部不再继承** → 所以下面必须把上面那几个头重新写一遍。
        if ($uri ~* "\.(?:html?|xhtml|xht|shtml|svgz?|xml|xsl|js|mjs|css|wasm)$") {
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        try_files $uri =404;
    }

    location /home-assets/ {
        alias /srv/home-assets/;
        access_log off;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://flashmuse-app:3000;
        limit_req zone=fm_api burst=200 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ⭐ 让上游知道我们能收 gzip（Next.js 自己也会压一部分）
        proxy_set_header Accept-Encoding "gzip";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}

# main / api 域名 DNS 已直指腾讯，443 直连（证书从马来复制，SAN 覆盖 main+api）
server {
    listen 443 ssl;
    http2 on;
    server_name main.venusface.com api.venusface.com;

    ssl_certificate /etc/letsencrypt/live/main.venusface.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/main.venusface.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # ⭐ 会话复用：255ms RTT 跨境下，免掉重复全握手（2026-08-02 审计 2.8o）
    ssl_session_cache shared:FMSSL:10m;
    ssl_session_timeout 10m;

    # ⭐ 安全响应头（不加 includeSubDomains：venusface.com 下还有别的项目）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1024m;
    client_body_timeout 300s;

    # ⭐ 大响应不落盘（见文件头注释）
    proxy_buffer_size 32k;
    proxy_buffers 32 32k;
    proxy_busy_buffers_size 128k;
    proxy_max_temp_file_size 0;

    # ⭐ JSON 压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain text/javascript application/x-javascript image/svg+xml;

    # ⛔⛔ 同 80 端口那份：内部台账不对外（理由见上）。
    location = /generated/videos/manifest.json { return 404; }

    location /generated/ {
        alias /srv/generated/;
        access_log off;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;

        # ⛔⛔ 同 80 端口那份：危险后缀一律当附件下载（理由与 nginx `if` 不继承 add_header 的坑见上）。
        if ($uri ~* "\.(?:html?|xhtml|xht|shtml|svgz?|xml|xsl|js|mjs|css|wasm)$") {
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        try_files $uri =404;
    }

    location /home-assets/ {
        alias /srv/home-assets/;
        access_log off;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://flashmuse-app:3000;
        limit_req zone=fm_api burst=200 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "gzip";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
